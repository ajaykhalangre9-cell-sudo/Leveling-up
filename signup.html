<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Leveling Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260811-upcoming" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/leveling-up-192.png" />
    <link rel="apple-touch-icon" href="assets/icons/leveling-up-192.png" />
  </head>
  <body>
    <main class="page-shell auth-page">
      <section class="auth-card">
        <div class="auth-header">
          <img class="auth-logo" src="assets/icons/leveling-up-192.png" alt="Leveling Up logo" />
          <p class="eyebrow">We are here for you, not for profit</p>
          <h1>Create your account</h1>
          <p class="auth-subtitle">
            Join Leveling Up and turn your goals into a daily path of progress.
          </p>
        </div>

        <button class="google-btn" type="button">
          <span class="google-mark">G</span>
          Continue with Google
        </button>

        <div class="auth-divider"><span>or</span></div>

        <form class="auth-form" id="signupForm">
          <label>
            <span>Full Name</span>
            <input type="text" id="signupName" placeholder="Enter your name" required />
          </label>

          <label>
            <span>Email Address</span>
            <input type="email" placeholder="Enter your email" required />
          </label>

          <label>
            <span>Password</span>
            <input type="password" placeholder="Create a password" required />
          </label>

          <label>
            <span>Confirm Password</span>
            <input type="password" placeholder="Confirm your password" required />
          </label>

          <button class="cta-button auth-submit" type="submit">Start My Journey</button>
        </form>

        <p class="auth-switch">
          Already have an account?
          <a href="login.html">Login</a>
        </p>

        <button class="install-app-btn signup-install-btn" id="installAppBtn" type="button">Install App</button>
      </section>
    </main>
    <div class="install-app-notice" id="installAppNotice" role="status" aria-live="polite" hidden></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script src="auth.js"></script>
    <script src="signup.js"></script>
    <script src="pwa-install.js"></script>
  </body>
</html>
