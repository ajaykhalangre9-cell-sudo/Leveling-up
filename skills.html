<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skills - Leveling Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/leveling-up-192.png" />
    <link rel="apple-touch-icon" href="assets/icons/leveling-up-192.png" />
  </head>
  <body>
    <div class="app-shell task-page">
      <aside class="sidebar">
        <div class="sidebar-top">
          <div class="brand-row">
            <div class="brand-title">
              <img class="brand-logo" src="assets/icons/leveling-up-192.png" alt="Leveling Up logo" />
              <h2>Leveling Up</h2>
            </div>
            <a class="settings-btn" href="dashboard.html">Back</a>
          </div>
        </div>
      </aside>

      <main class="dashboard-main task-main">
        <section class="task-card">
          <div class="task-head">
            <div>
              <p class="eyebrow">Growth path</p>
              <h1>Skills Section</h1>
            </div>
            <div id="skillsStatus" class="success-message" aria-live="polite"></div>
          </div>

          <form id="skillsForm" class="task-form">
            <input type="text" id="skillsTitle" placeholder="Skill title" required />
            <textarea id="skillsDescription" placeholder="Skill description" rows="3"></textarea>
            <label>
              <span>Target date</span>
              <input type="date" id="skillsDeadline" />
            </label>
            <button type="submit" class="cta-button">Add Skill</button>
          </form>

          <div id="skillsList" class="task-list"></div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script src="theme.js"></script>
    <script src="skills.js"></script>
  </body>
</html>
