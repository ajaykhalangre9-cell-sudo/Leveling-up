<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog - Leveling Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/leveling-up-192.png" />
    <link rel="apple-touch-icon" href="assets/icons/leveling-up-192.png" />
  </head>
  <body>
    <div class="app-shell task-page">
      <aside class="sidebar">
        <div class="sidebar-top">
          <div class="brand-row">
            <div class="brand-title">
              <img class="brand-logo" src="assets/icons/leveling-up-192.png" alt="Leveling Up logo" />
              <h2>Leveling Up</h2>
            </div>
            <a class="settings-btn back-btn" href="dashboard.html" aria-label="Back to dashboard">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.7 5.3-6.7 6.7 6.7 6.7 1.4-1.4-5.3-5.3 5.3-5.3-1.4-1.4Z" /></svg>
              <span>Back</span>
            </a>
          </div>
        </div>
      </aside>

      <main class="dashboard-main task-main">
        <section class="task-card blog-card">
          <div class="blog-hero">
            <div>
              <p class="eyebrow">Leveling Up community</p>
              <h1>Stories that move us forward</h1>
              <p>Read practical ideas from the community, or share your own next-level lesson.</p>
            </div>
            <button id="openBlogEditor" class="blog-compose-button" type="button" aria-expanded="false" aria-controls="blogForm">
              <span aria-hidden="true">+</span><span>Write a blog</span>
            </button>
          </div>
          <div id="blogStatus" class="success-message" aria-live="polite"></div>

          <form id="blogForm" class="blog-form" hidden>
            <div class="blog-form-heading">
              <div>
                <p class="eyebrow">New post</p>
                <h2>Write your blog</h2>
              </div>
              <button id="closeBlogEditor" class="blog-close-button" type="button" aria-label="Close blog editor">&times;</button>
            </div>
            <label for="blogTitle">Blog title</label>
            <input type="text" id="blogTitle" placeholder="Give your story a clear title" required maxlength="120" />
            <label for="blogDescription">Your blog</label>
            <textarea id="blogDescription" placeholder="Share an insight, lesson, or idea with the community…" rows="7" required maxlength="5000"></textarea>
            <div class="blog-form-actions">
              <button id="cancelBlogEditor" type="button" class="blog-cancel-button">Cancel</button>
              <button type="submit" class="cta-button">Publish blog</button>
            </div>
          </form>

          <div class="blog-feed-heading"><h2>Latest blogs</h2><span>Community feed</span></div>
          <div id="blogList" class="blog-list"></div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script src="theme.js"></script>
    <script src="blog.js"></script>
  </body>
</html>
